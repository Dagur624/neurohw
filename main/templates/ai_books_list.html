{% extends "base.html" %}
{% block content %}
    <h1>Теория</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-outline-success">Отфильтровать</button>

    </form>
    <div class="row p-1">
        {% for title in titles %}
            <div class="col-auto">
                <div class="card" style="width: 300px">

                    <div class="card-body">
                        <h3 class="card-title">{{ title.title }}</h3>
                        <h5 class="card-title">{{ title.theme }} - {{ title.theme.subject }}</h5>
                        <p class="card-text">{{ title.text |truncatechars:50}}</p>
                        <a href="{% url 'ai_book' title.id %}" class="card-link">Card link</a>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
{% endblock %}
